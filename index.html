                    ${hasPendingEdits ? html`
                        <div class="banner no-print">
                            ${icon('edit')}
                            <div class="banner-text"><strong>Unsaved edits</strong><p>You started editing this report but haven't updated it yet.</p></div>
                            <button type="button" class="mini-btn" data-action="edit-report" data-id="${e.id}">Continue</button>
                        </div>` : ''}
                    ${e.sections.map(renderSection)}
                    <details class="card plain no-print" id="plainText">
                        <summary>Plain-text version${icon('down')}</summary>
                        <pre>${reportText(found)}</pre>
                    </details>
                    <div class="row no-print">
                        <button class="btn btn-secondary" data-action="print-report">${icon('printer')}Print / PDF</button>
                        <button class="btn btn-secondary btn-danger-outline" data-action="delete-report" data-id="${e.id}">${icon('trash')}Delete</button>
                    </div>
                </article>`,
            actions: html`
                ${e.form ? html`<button class="btn btn-secondary" data-action="edit-report" data-id="${e.id}">${icon('edit')}Edit</button>` : ''}
                <button class="btn ${canShare ? 'btn-secondary' : 'btn-primary btn-grow'}" data-action="copy-report" data-id="${e.id}">${icon('copy')}Copy</button>
                ${canShare ? html`<button class="btn btn-primary btn-grow" data-action="share-report" data-id="${e.id}">${icon('share')}Share</button>` : ''}`
        };
    }

    async function copyText(text) {
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return true;
            }
        } catch { /* fall through to legacy copy */ }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch { ok = false; }
        ta.remove();
        return ok;
    }

    async function copyReport(id) {
        const entry = findEntry(id);
        if (!entry) return;
        if (await copyText(reportText(entry))) {
            toast('Report copied to clipboard');
        } else {
            const details = $('#plainText');
            if (details) { details.open = true; details.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
            toast('Copy blocked — select the plain-text version and copy it manually', { error: true, duration: 5000 });
        }
    }

    async function shareReport(id) {
        const entry = findEntry(id);
        if (!entry) return;
        const e = normalizeEntry(entry);
        try {
            await navigator.share({ title: `${MODES[e.mode].title}: ${e.title}`, text: reportText(entry) });
        } catch (err) {
            if (err && err.name === 'AbortError') return;
            copyReport(id);
        }
    }

    async function editReport(id) {
        const entry = findEntry(id);
        if (!entry || !isObj(entry.form)) return;
        const drafts = loadDrafts();
        const existing = drafts[entry.mode];
        const sameEdit = existing && String(existing.editingId) === String(entry.id);
        if (existing && !sameEdit) {
            const ok = await confirmDialog({
                title: 'Replace unsaved draft?',
                message: `You have an unfinished ${MODES[entry.mode].title.toLowerCase()} draft. Editing this report will replace it.`,
                confirmLabel: 'Replace draft',
                danger: true
            });
            if (!ok) return;
        }
        if (!sameEdit) {
            drafts[entry.mode] = { form: { ...entry.form }, editingId: entry.id, savedAt: Date.now() };
            saveDrafts(drafts);
        }
        navigate('form', { mode: entry.mode });
    }

    function deleteReport(id) {
        const log = loadLog();
        const idx = log.findIndex(e => String(e.id) === String(id));
        if (idx < 0) return;
        const [removed] = log.splice(idx, 1);
        saveLog(log);
        const drafts = loadDrafts();
        const editDraft = drafts[removed.mode];
        if (editDraft && String(editDraft.editingId) === String(id)) { delete drafts[removed.mode]; saveDrafts(drafts); }
        const undo = () => {
            const cur = loadLog();
            if (cur.some(e => String(e.id) === String(removed.id))) return;
            cur.splice(Math.min(idx, cur.length), 0, removed);
            saveLog(cur);
            if (editDraft && String(editDraft.editingId) === String(id)) {
                const d = loadDrafts();
                if (!d[removed.mode]) { d[removed.mode] = editDraft; saveDrafts(d); }
            }
            if (state.view === 'log' || state.view === 'home') render();
            toast('Report restored');
        };
        if (state.view === 'report') {
            state.skipMissing = true;
            goBack();
        } else {
            render();
        }
        toast('Report deleted', { action: { label: 'Undo', fn: undo } });
    }

    // ----- Log -----
    function filteredLog() {
        const q = state.logQuery.trim().toLowerCase();
        return loadLog()
            .map(raw0 => ({ raw0, e: normalizeEntry(raw0) }))
            .filter(({ e }) => state.logFilter === 'all' || e.mode === state.logFilter)
            .filter(({ raw0 }) => !q || reportText(raw0).toLowerCase().includes(q))
            .map(({ e }) => e)
            .sort((a, b) => b.createdAt - a.createdAt);
    }

    function dayLabel(ts) {
        const d = new Date(ts);
        const today = todayISO();
        const y = new Date(); y.setDate(y.getDate() - 1);
        if (todayISO(d) === today) return 'Today';
        if (todayISO(d) === todayISO(y)) return 'Yesterday';
        return fmtDate(todayISO(d));
    }

    function renderLogList() {
        const entries = filteredLog();
        if (!entries.length) {
            return html`
                <div class="empty-state">
                    <span class="tile tile-log">${icon('search')}</span>
                    <p class="empty-title">No matching reports</p>
                    <p class="empty-text">Try a different search or filter.</p>
                </div>`;
        }
        let lastDay = null;
        return html`${entries.map(e => {
            const day = dayLabel(e.createdAt);
            const heading = day !== lastDay ? html`<p class="day-label">${day}</p>` : '';
            lastDay = day;
            return html`${heading}
                <button class="card list-item" data-action="nav" data-view="report" data-id="${e.id}">
                    <span class="tile tile-md tile-${e.mode}">${icon(MODES[e.mode].icon)}</span>
                    <span class="item-text">
                        <span class="item-title">${e.title}</span>
                        <span class="item-sub">${e.subtitle || MODES[e.mode].title}</span>
                    </span>
                    <span class="item-time">${nowHM(new Date(e.createdAt))}${e.updatedAt ? html`<span class="pill pill-blue">Edited</span>` : ''}</span>
                </button>`;
        })}`;
    }

    function viewLog() {
        const log = loadLog();
        if (!log.length) {
            return {
                title: 'Reports Log',
                subtitle: 'No saved reports',
                body: html`
                    <div class="empty-state">
                        <span class="tile tile-log">${icon('archive')}</span>
                        <p class="empty-title">No saved reports yet</p>
                        <p class="empty-text">Every report you generate is saved here automatically, on this device.</p>
                        <button class="btn btn-primary" data-action="home">Start a report</button>
                        <button class="btn btn-ghost" data-action="nav" data-view="settings">${icon('upload')}Restore from backup</button>
                    </div>`
            };
        }
        const counts = { all: log.length };
        log.forEach(e => { const mode = MODES[e.mode] ? e.mode : 'incident'; counts[mode] = (counts[mode] || 0) + 1; });
        const filters = [['all', 'All'], ...Object.entries(MODES).map(([id, m]) => [id, m.short])];
        return {
            title: 'Reports Log',
            subtitle: `${log.length} report${log.length === 1 ? '' : 's'} saved on this device`,
            body: html`
                <div class="stack-sm">
                    <div class="search">
                        ${icon('search')}
                        <input class="input" type="search" id="logSearch" placeholder="Search address, watch, notes…" value="${state.logQuery}" aria-label="Search reports" autocomplete="off">
                    </div>
                    <div class="filters" role="group" aria-label="Filter by type">
                        ${filters.map(([id, label]) => html`<button class="filter" data-action="log-filter" data-filter="${id}" aria-pressed="${String(state.logFilter === id)}">${label} · ${counts[id] || 0}</button>`)}
                    </div>
                    <div class="stack-sm" id="logList">${renderLogList()}</div>
                </div>`
        };
    }

    // ----- Settings -----
    function viewSettings() {
        const logRaw = localStorage.getItem(KEYS.log) || '';
        const count = loadLog().length;
        const kb = Math.max(0, Math.round(new Blob([logRaw]).size / 1024));
        return {
            title: 'Settings',
            subtitle: 'Preferences & data',
            body: html`
                <div class="stack">
                    <section class="card settings-group">
                        <h2 class="section-title">Appearance</h2>
                        <div class="seg" role="group" aria-label="Theme">
                            ${[['system', 'System'], ['light', 'Light'], ['dark', 'Dark']].map(([val, label]) => html`<button type="button" data-action="set-theme" data-value="${val}" aria-pressed="${String(prefs.theme === val)}">${label}</button>`)}
                        </div>
                    </section>
                    <section class="card settings-group">
                        <h2 class="section-title">Defaults</h2>
                        <div class="field">
                            <label class="label" for="prefStation">Home station</label>
                            <select class="input" id="prefStation">${STATIONS.map(s => html`<option value="${s}" ${s === prefs.station ? raw('selected') : ''}>${s}</option>`)}</select>
                            <p class="help">Pre-selected as the responding station on new incident reports.</p>
                        </div>
                    </section>
                    <section class="card settings-group">
                        <h2 class="section-title">Data</h2>
                        <div>
                            <p class="settings-label">${count} report${count === 1 ? '' : 's'} stored · ${kb} KB</p>
                            <p class="settings-desc">Reports live only in this browser. Export a backup regularly — clearing browser data or changing phones will erase them.</p>
                        </div>
                        <div class="row">
                            <button class="btn btn-secondary" data-action="export">${icon('download')}Export</button>
                            <button class="btn btn-secondary" data-action="import">${icon('upload')}Import</button>
                        </div>
                        <button class="btn btn-secondary btn-danger-outline" data-action="clear-log" ${count ? '' : raw('disabled')}>${icon('trash')}Delete all reports</button>
                    </section>
                    <p class="version">StationBrain v${APP_VERSION}</p>
                </div>`
        };
    }

    function exportBackup() {
        const log = loadLog();
        if (!log.length) { toast('No reports to export'); return; }
        const data = JSON.stringify({ app: 'StationBrain', version: APP_VERSION, exportedAt: new Date().toISOString(), reports: log }, null, 2);
        const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `stationbrain-backup-${todayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast(`Exported ${log.length} report${log.length === 1 ? '' : 's'}`);
    }

    async function importBackup(file) {
        let data;
        try { data = JSON.parse(await file.text()); }
        catch { toast('That file is not a valid StationBrain backup', { error: true }); return; }
        const incoming = Array.isArray(data) ? data : (isObj(data) && Array.isArray(data.reports) ? data.reports : null);
        if (!incoming) { toast('No reports found in that file', { error: true }); return; }
        const valid = incoming.filter(e => isObj(e) && e.id != null && MODES[e.mode]);
        const log = loadLog();
        const ids = new Set(log.map(e => String(e.id)));
        const added = valid.filter(e => !ids.has(String(e.id)));
        const merged = [...log, ...added].sort((a, b) => (Number(b.createdAt) || Number(b.id) || 0) - (Number(a.createdAt) || Number(a.id) || 0));
        if (!saveLog(merged)) { toast('Import failed — device storage is full', { error: true }); return; }
        render();
        const skipped = incoming.length - added.length;
        toast(`Imported ${added.length} report${added.length === 1 ? '' : 's'}${skipped ? ` · ${skipped} skipped (duplicate or invalid)` : ''}`);
    }

    async function clearAllReports() {
        const count = loadLog().length;
        const ok = await confirmDialog({
            title: 'Delete all reports?',
            message: `This permanently removes ${count} saved report${count === 1 ? '' : 's'} from this device. Export a backup first if you might need them.`,
            confirmLabel: 'Delete all',
            danger: true
        });
        if (!ok) return;
        saveLog([]);
        const drafts = loadDrafts();
        Object.values(drafts).forEach(d => { if (isObj(d)) d.editingId = null; });
        saveDrafts(drafts);
        render();
        toast('All reports deleted');
    }

    // ----- Static pages -----

        if (type === 'about') {
            return {
                title: 'About',
                subtitle: 'StationBrain',
                body: html`

                        <p>The app pulls together information that would normally live in paper logs, notebooks, or on the whiteboard and structures it in one place for easier review. StationBrain is intended to complement, not replace, the Brigade's official procedures, command structure, or mandated documentation. All operational decisions must continue to follow official JFB policies, orders, and the established chain of command.</p>

                        <p>Everything you enter stays in this browser on this device. Nothing is uploaded. Drafts save automatically as you type, and you can export a backup from Settings.</p>
                    </article>`
            };

        return {
            title: 'Legal',
            subtitle: 'Disclaimer',
            body: html`
                <article class="card page">
                    <h2>Legal Disclaimer</h2>

                    <p>Nothing in StationBrain, including any data, analytics, guidance, or generated reports, is intended to constitute medical advice, legal advice, or any other kind of professional advice. Users must rely on their training, supervisors, and qualified professionals when making decisions that could affect health, safety, employment, or legal rights.</p>
                </article>`

    // ---------- Actions ----------
    const ACTIONS = {
        'back': () => goBack(),
        'home': () => {
            const hadDraft = state.view === 'form' && saveDraftNow();
            goHome();
            if (hadDraft) toast('Draft saved — tap the card to continue');
        },
        'nav': el => navigate(el.dataset.view, el.dataset.id != null ? { id: el.dataset.id } : {}),
        'open-mode': el => navigate('form', { mode: el.dataset.mode }),
        'toggle-theme': () => { prefs.theme = resolvedTheme() === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); },
        'set-theme': el => { prefs.theme = el.dataset.value; savePrefs(); applyTheme(); },
        'seg': el => onSeg(el),
        'now': el => setInputValue(el.dataset.field, nowHM()),
        'stamp': el => insertStamp(el.dataset.field),
        'check-all': () => {
            CHECKS.forEach(c => { state.form[checkKey(c)] = 'yes'; });
            $$('.check-row [data-action="seg"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === 'yes')));
            updateComputed();
            scheduleDraftSave();
        },
        'generate': () => generate(),
        'clear-form': async () => {
            const ok = await confirmDialog({ title: 'Clear this form?', message: 'All entries on this form will be erased. Saved reports in the log are not affected.', confirmLabel: 'Clear form', danger: true });
            if (!ok) return;
            state.form = FORMS[state.mode].defaults();
            state.editingId = null;
            saveDraftNow();
            render();
            toast('Form cleared');
        },
        'discard-edit': async () => {
            const id = state.editingId;
            const ok = await confirmDialog({ title: 'Discard changes?', message: 'Your edits will be thrown away. The saved report stays as it was.', confirmLabel: 'Discard', danger: true });
            if (!ok) return;
            const drafts = loadDrafts();
            delete drafts[state.mode];
            saveDrafts(drafts);
            state.mode = null;
            navigate('report', { id }, { replace: true });
        },
        'copy-report': el => copyReport(el.dataset.id),
        'share-report': el => shareReport(el.dataset.id),
        'edit-report': el => editReport(el.dataset.id),
        'print-report': () => window.print(),
        'delete-report': el => deleteReport(el.dataset.id),
        'log-filter': el => {
            state.logFilter = el.dataset.filter;
            $$('[data-action="log-filter"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === state.logFilter)));
            $('#logList').innerHTML = renderLogList().s;
        },
        'export': () => exportBackup(),
        'import': () => $('#importFile').click(),
        'clear-log': () => clearAllReports()
    };

    document.addEventListener('click', e => {
        const el = e.target.closest('[data-action]');
        if (!el || el.disabled) return;
        const fn = ACTIONS[el.dataset.action];
        if (fn) { e.preventDefault(); fn(el, e); }
    });

    document.addEventListener('input', e => {
        if (e.target.id === 'logSearch') {
            state.logQuery = e.target.value;
            $('#logList').innerHTML = renderLogList().s;
        }
    });

    document.addEventListener('change', e => {
        if (e.target.id === 'prefStation') { prefs.station = e.target.value; savePrefs(); toast('Home station updated'); }
        if (e.target.id === 'importFile' && e.target.files[0]) {
            importBackup(e.target.files[0]).finally(() => { e.target.value = ''; });
        }
    });

    // ---------- Boot ----------
    (function boot() {
        const initial = validState(history.state) ? history.state : { view: 'home', params: {}, depth: 0 };
        history.replaceState(initial, '');
        show(initial);
    })();

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err));
        });
    }
    </script>
</body>
</html>
