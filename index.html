        }
    };

    const fieldLabel = (mode, id) => {
        for (const s of FORMS[mode].sections) {
            const fd = s.fields.flat().find(x => x.id === id);
            if (fd && fd.label) return fd.label;
        }
        return id;
    };

    // ---------- Report building ----------
    function pumpText(start, stop) {
        const d = duration(start, stop);
        if (d) return `${d.text} (${start}–${stop}${d.nextDay ? ', past midnight' : ''})`;
        if (start || stop) return [start && `Started ${start}`, stop && `Stopped ${stop}`].filter(Boolean).join(', ');
        return NE;
    }

    // Short human-readable reference, e.g. SB-261003-1430.
    function refFor(ts) {
        const d = new Date(ts);
        return `SB-${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
    }
    function buildReport(mode, fd) {
        const t = x => str(x).trim();
        if (mode === 'incident') {
            const typeLabel = labelOf(INCIDENT_TYPES, fd.incidentType) || NE;
            const dur = duration(fd.timeLeaving, fd.timeReturn);
            const distance = t(fd.distance).replace(/\s*km$/i, '');
            const sections = [
                {
                    title: 'Administration', rows: [
                        ['Classification', typeLabel.toUpperCase()],
                        ['Watch', fd.watch ? `Watch ${fd.watch}` : NE],
                        ['District Officer', v(fd.districtOfficer)],
                        ['Unit # / Appliance', v(fd.unit)],
                        ['No. of Men', v(fd.menPresent)]
                    ]
                },
                {
                    title: 'Response', rows: [
                        ['Responding Station', v(fd.respondingStation)],
                        ['Date of Call', fd.dateCall ? fmtDate(fd.dateCall) : NE],
                        ['Time of Call', v(fd.timeCall)],
                        ['How Called', v(fd.howCalled)],
                        ['Time Leaving', v(fd.timeLeaving)],
                        ['Time Return', fd.timeReturn ? fd.timeReturn + (dur && dur.nextDay ? ' (next day)' : '') : NE],
                        ...(dur ? [['Time Out of Station', dur.text]] : []),
                        ['Pump Time', pumpText(fd.pumpStart, fd.pumpStop)]
                    ]
                },
                {
                    title: 'Location & Risk', rows: [
                        ['Address', v(fd.loc)],
                        ['Type of Premises', v(fd.typePremises)],
                        ['Distance', distance ? `${distance} km` : NE],
                        ['Est. Risk', v(fd.estRisk)],
                        ['Est. Loss', v(fd.estLoss)]
                    ]
                },
                {
                    title: 'Parties & Origin', rows: [
                        ['Owner', v(fd.owner)],
                        ['Occupier', v(fd.occupier)],
                        ['Supposed Origin', v(fd.supposedOrigin)]
                    ]
                }
            ];
            if (fd.incidentType === 'house_fire') {
                sections.push({ title: 'House Fire Details', rows: [['No. of Occupants', v(fd.occupants)], ['Insured', labelOf(YES_NO, fd.insured) || NE]] });
            }
            if (VEHICLE_TYPES.includes(fd.incidentType)) {
                sections.push({ title: 'Vehicle Details', rows: [['License Plate', v(fd.licensePlate)], ['Vehicles Involved', v(fd.vehicleCount)]] });
            }
            sections.push({ title: 'Narrative', text: t(fd.notes) || 'No notes recorded.' });
            const station = t(fd.respondingStation);
            const showStation = station && !t(fd.loc).toLowerCase().includes(station.toLowerCase());
            return { title: typeLabel, subtitle: [t(fd.loc), showStation ? station : ''].filter(Boolean).join(' · '), sections };
        }
        if (mode === 'handover') {
            const watchLine = fd.watch ? `Watch ${fd.watch}${fd.incomingWatch ? ` → Watch ${fd.incomingWatch}` : ''}` : '';
            return {
                title: 'Shift Handover',
                subtitle: [watchLine, fd.date ? fmtDate(fd.date) : ''].filter(Boolean).join(' · '),
                sections: [
                    {
                        title: 'Administration', rows: [
                            ['Date', fd.date ? fmtDate(fd.date) : NE],
                            ['Outgoing Watch', fd.watch ? `Watch ${fd.watch}` : NE],
                            ['Incoming Watch', fd.incomingWatch ? `Watch ${fd.incomingWatch}` : NE],
                            ['District Officer', v(fd.districtOfficer)]
                        ]
                    },
                    { title: 'Station Checklist', checks: CHECKS.map(c => ({ label: c, status: ['yes', 'no'].includes(fd[checkKey(c)]) ? fd[checkKey(c)] : 'unset' })) },
                    {
                        title: 'Classes & Activities', blocks: [
                            { label: 'Classes Conducted', text: t(fd.classes) || 'None recorded' },
                            { label: 'Activities Completed', text: t(fd.activities) || 'None recorded' }
                        ]
                    },
                    { title: 'Outstanding Issues & Defects', text: t(fd.issues) || 'None recorded' },
                    { title: 'Shift Summary', text: t(fd.summary) || 'No notes recorded.' }
                ]
            };
        }
        const sections = [
            {
                title: 'Administration', rows: [
                    ['Date', fd.date ? fmtDate(fd.date) : NE],
                    ['Watch', fd.watch ? `Watch ${fd.watch}` : NE],
                    ['District Officer', v(fd.districtOfficer)],
                    ['Related Incident', v(fd.relatedIncident)]
                ]
            }
        ];
        if (t(fd.attendees)) sections.push({ title: 'Attendees', text: t(fd.attendees) });
        sections.push({ title: 'Debrief Notes', text: t(fd.notes) || 'No notes recorded.' });
        if (t(fd.wentWell)) sections.push({ title: 'What Went Well', text: t(fd.wentWell) });
        if (t(fd.improve)) sections.push({ title: 'Areas for Improvement', text: t(fd.improve) });
        if (t(fd.actions)) sections.push({ title: 'Action Items', text: t(fd.actions) });
        return {
            title: 'Debriefing',
            subtitle: [t(fd.relatedIncident), fd.date ? fmtDate(fd.date) : ''].filter(Boolean).join(' · '),
            sections
        };
    }

    // Converts any stored entry (including pre-2.2 log entries) into the current shape.
    function normalizeEntry(e) {
        const mode = MODES[e.mode] ? e.mode : 'incident';
        const createdAt = Number(e.createdAt) || Number(e.id) || Date.now();
        const base = {
            id: e.id,
            mode,
            createdAt,
            updatedAt: Number(e.updatedAt) || null,
            timestamp: str(e.timestamp) || fmtStamp(createdAt),
            ref: str(e.ref) || refFor(createdAt),
            form: isObj(e.form) ? e.form : null
        };
        if (Array.isArray(e.sections)) {
            return {
                ...base,
                title: str(e.title) || MODES[mode].title,
                subtitle: str(e.subtitle),
                sections: e.sections.filter(isObj).map(s => ({
                    title: str(s.title),
                    rows: Array.isArray(s.rows) ? s.rows.filter(Array.isArray).map(r => [str(r[0]), str(r[1])]) : null,
                    checks: Array.isArray(s.checks) ? s.checks.filter(isObj).map(c => ({ label: str(c.label), status: ['yes', 'no'].includes(c.status) ? c.status : 'unset' })) : null,
                    text: s.text == null ? null : str(s.text),
                    blocks: Array.isArray(s.blocks) ? s.blocks.filter(isObj).map(b => ({ label: str(b.label), text: str(b.text) })) : null
                }))
            };
        }
        // Legacy (v2.1 and earlier): { admin, narrative, checks, classes, activities }
        const admin = isObj(e.admin) ? e.admin : {};
        const sections = [{ title: 'Administration', rows: Object.entries(admin).map(([k, val]) => [str(k), str(val)]) }];
        sections.push({ title: 'Narrative', text: str(e.narrative) || 'No notes recorded.' });
        if (Array.isArray(e.checks) && e.checks.length) {
            sections.push({
                title: 'Checks', checks: e.checks.filter(isObj).map(c => {
                    const s = str(c.status).toUpperCase();
                    return { label: str(c.label), status: s.includes('DONE') ? 'yes' : (/\bNO\b/.test(s) ? 'no' : 'unset') };
                })
            });
        }
        if (e.classes || e.activities) {
            sections.push({ title: 'Classes & Activities', blocks: [{ label: 'Classes Conducted', text: str(e.classes) || NE }, { label: 'Activities Completed', text: str(e.activities) || NE }] });
        }
        const has = k => admin[k] && admin[k] !== NE;
        let title = MODES[mode].title, subtitle = '';
        if (mode === 'incident') {
            title = has('Classification') ? titleCase(admin.Classification).replace(/\bMva\b/, 'MVA') : title;
            subtitle = [has('Location') ? admin.Location : '', has('Station') ? admin.Station : ''].filter(Boolean).join(' · ');
        } else if (has('Watch')) {
            subtitle = `Watch ${admin.Watch}`;
        }
        return { ...base, title, subtitle, sections };
    }

    function reportText(entry) {
        const e = normalizeEntry(entry);
        const rule = '-'.repeat(40);
        const lines = ['STATIONBRAIN REPORT', rule, `REPORT TYPE: ${MODES[e.mode].title.toUpperCase()}`, `REFERENCE: ${e.ref}`, `GENERATED: ${e.timestamp}`];
        if (e.updatedAt) lines.push(`UPDATED: ${fmtStamp(e.updatedAt)}`);
        e.sections.forEach(s => {
            lines.push('', s.title.toUpperCase(), rule);
            (s.rows || []).forEach(([k, val]) => lines.push(`${k}: ${val}`));
            (s.checks || []).forEach(c => lines.push(`${c.label}: ${STATUS_TEXT[c.status]}`));
            if (s.text != null) lines.push(s.text);
            (s.blocks || []).forEach((b, i) => {
                if (i) lines.push('');
                lines.push(`${b.label}:`, b.text);
            });
        });
        lines.push('', rule, ...FOOTNOTE);
        return lines.join('\n');
    }

    // ---------- App state & navigation ----------
    const state = {
        view: 'home',
        params: {},
        mode: null,
        form: {},
        editingId: null,
        logQuery: '',
        logFilter: 'all',
        skipMissing: false
    };

    const validState = s => isObj(s) && typeof s.view === 'string';

    function navigate(view, params = {}, { replace = false } = {}) {
        const cur = validState(history.state) ? history.state : { depth: 0 };
        const next = { view, params, depth: replace ? (cur.depth || 0) : (cur.depth || 0) + 1 };
        if (replace) history.replaceState(next, ''); else history.pushState(next, '');
        show(next);
    }

    function goHome() {
        const depth = validState(history.state) ? history.state.depth || 0 : 0;
        if (depth > 0) history.go(-depth);
        else navigate('home', {}, { replace: true });
    }

    function goBack() {
        const depth = validState(history.state) ? history.state.depth || 0 : 0;
        if (depth > 0) history.back();
        else navigate('home', {}, { replace: true });
    }

    function show(s) {
        saveDraftNow();
        state.view = s.view;
        state.params = s.params || {};
        if (state.view === 'form') {
            if (!MODES[state.params.mode]) { state.view = 'home'; }
            else enterForm(state.params.mode);
        } else {
            state.mode = null;
        }
        if (state.view === 'report' && !findEntry(state.params.id) && state.skipMissing) {
            history.back();
            return;
        }
        state.skipMissing = false;
        render();
    }

    window.addEventListener('popstate', e => show(validState(e.state) ? e.state : { view: 'home', params: {}, depth: 0 }));

    // ---------- Drafts ----------
    function compact(o) {
        return JSON.stringify(Object.keys(o || {}).sort()
            .filter(k => o[k] !== '' && o[k] != null && o[k] !== 'not_stated')
            .map(k => [k, o[k]]));
    }

    function enterForm(mode) {
        const d = loadDrafts()[mode];
        state.mode = mode;
        state.form = d && isObj(d.form) ? { ...d.form } : FORMS[mode].defaults();
        state.editingId = d && d.editingId != null && findEntry(d.editingId) ? d.editingId : null;
    }

    function isMeaningful() {
        if (state.editingId != null) {
            const e = findEntry(state.editingId);
            return !e || compact(e.form) !== compact(state.form);
        }
        return compact(state.form) !== compact(FORMS[state.mode].defaults());
    }

    let draftTimer = null;
    function scheduleDraftSave() {
        clearTimeout(draftTimer);
        draftTimer = setTimeout(saveDraftNow, 350);
    }

    function saveDraftNow() {
        clearTimeout(draftTimer);
        draftTimer = null;
        if (state.view !== 'form' || !state.mode) return false;
        const drafts = loadDrafts();
        const meaningful = isMeaningful();
        if (meaningful) drafts[state.mode] = { form: state.form, editingId: state.editingId, savedAt: Date.now() };
        else delete drafts[state.mode];
        const ok = saveDrafts(drafts);
        if (meaningful && ok) flashSaved();
        return meaningful && ok;
    }

    let savedTimer = null;
    function flashSaved() {
        const el = $('#saveState');
        el.innerHTML = html`${icon('check')}Saved`.s;
        el.classList.add('show');
        clearTimeout(savedTimer);
        savedTimer = setTimeout(() => el.classList.remove('show'), 1600);
    }

    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraftNow(); });
    window.addEventListener('pagehide', saveDraftNow);

    // ---------- Theme ----------
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    const resolvedTheme = () => prefs.theme === 'dark' || (prefs.theme !== 'light' && darkQuery.matches) ? 'dark' : 'light';
    function applyTheme() {
        const theme = resolvedTheme();
        document.documentElement.setAttribute('data-theme', theme);
        $('#metaTheme').setAttribute('content', theme === 'dark' ? '#161513' : '#faf9f7');
        const btn = $('#themeBtn');
        btn.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon').s;
        btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
        $$('[data-action="set-theme"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === prefs.theme)));
        syncSegs();
    }
    const onSchemeChange = () => { if (prefs.theme === 'system') applyTheme(); };
    if (darkQuery.addEventListener) darkQuery.addEventListener('change', onSchemeChange);
    else if (darkQuery.addListener) darkQuery.addListener(onSchemeChange);

    // ---------- Toast & dialog ----------
    let toastTimer = null;
    function toast(message, { action = null, error = false, duration: ms } = {}) {
        const el = $('#toast');
        el.className = 'toast' + (error ? ' error' : '') + (action ? ' has-action' : '');
        el.innerHTML = html`<span>${message}</span>${action ? html`<button class="toast-action" type="button">${action.label}</button>` : ''}`.s;
        if (action) el.querySelector('button').onclick = () => { hideToast(); action.fn(); };
        void el.offsetWidth; // restart the entrance when one toast replaces another
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, ms || (action ? 6000 : 2800));
    }
    function hideToast() { $('#toast').classList.remove('show'); }

    function confirmDialog({ title, message, confirmLabel = 'Confirm', danger = false }) {
        const dlg = $('#dialog');
        if (dlg.open) return Promise.resolve(false);
        if (typeof dlg.showModal !== 'function') return Promise.resolve(window.confirm(`${title}\n\n${message}`));
        $('#dialogTitle').textContent = title;
        $('#dialogMsg').textContent = message;
        const ok = $('#dialogOk');
        ok.textContent = confirmLabel;
        ok.className = `btn ${danger ? 'btn-danger' : 'btn-primary'}`;
        dlg.returnValue = '';
        dlg.classList.remove('is-closing');
        return new Promise(resolve => {
            dlg.addEventListener('close', () => resolve(dlg.returnValue === 'ok'), { once: true });
            dlg.showModal();
            $('#dialogCancel').focus();
        });
    }
    // Buttons and Escape close the dialog through here, so it can settle out
    // (scale down, backdrop fades) before it actually closes.
    const DIALOG_EXIT_MS = 160;
    function closeDialog(value) {
        const dlg = $('#dialog');
        if (!dlg.open || dlg.classList.contains('is-closing')) return;
        const done = () => { dlg.classList.remove('is-closing'); dlg.close(value); };
        if (reducedMotion()) { done(); return; }
        dlg.classList.add('is-closing');
        setTimeout(done, DIALOG_EXIT_MS);
    }
    $('#dialog').addEventListener('click', e => {
        const btn = e.target.closest('button[value]');
        if (btn) { e.preventDefault(); closeDialog(btn.value); }
    });
    $('#dialog form').addEventListener('submit', e => { e.preventDefault(); closeDialog('cancel'); });
    $('#dialog').addEventListener('cancel', e => { e.preventDefault(); closeDialog('cancel'); });

    // ---------- Motion helpers ----------
    const reducedMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    // Segmented controls: one pill per control slides to the pressed option.
    // A control whose pill can't be measured (hidden section) paints its
    // pressed button directly instead (.seg:not(.has-pill) in the CSS).
    function syncSegs(root = document) {
        root.querySelectorAll('.seg').forEach(seg => {
            let pill = seg.querySelector(':scope > .seg-pill');
            if (!pill) {
                pill = document.createElement('span');
                pill.className = 'seg-pill';
                pill.setAttribute('aria-hidden', 'true');
                seg.prepend(pill);
            }
            const on = seg.querySelector('button[aria-pressed="true"]');
            if (!seg.offsetWidth) { seg.classList.remove('has-pill'); pill.dataset.placed = ''; return; }
            seg.classList.add('has-pill');
            pill.classList.toggle('is-off', !on);
            pill.classList.toggle('is-yes', !!on && on.classList.contains('opt-yes'));
            pill.classList.toggle('is-no', !!on && on.classList.contains('opt-no'));
            if (!on) return;
            const first = !pill.dataset.placed;
            if (first) pill.style.transition = 'none';
            pill.style.width = `${on.offsetWidth}px`;
            pill.style.height = `${on.offsetHeight}px`;
            pill.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
            pill.dataset.placed = '1';
            if (first) { void pill.offsetWidth; pill.style.transition = ''; }
        });
    }

    // Counts up from 0 on arrival (home stats).
    function countUp(root = document) {
        root.querySelectorAll('[data-count]').forEach(el => {
            const to = Number(el.dataset.count) || 0;
            if (!to || reducedMotion()) { el.textContent = String(to); return; }
            const dur = 700;
            let start = null;
            const tick = now => {
                if (!el.isConnected) return;
                // Hold at 0 while the loading screen is still up.
                if (document.documentElement.classList.contains('nsc-booting')) { requestAnimationFrame(tick); return; }
                if (start == null) start = now + 150;
                const t = Math.min(1, Math.max(0, (now - start) / dur));
                el.textContent = String(Math.round(to * (1 - Math.pow(1 - t, 3))));
                if (t < 1) requestAnimationFrame(tick);
            };
            el.textContent = '0';
            requestAnimationFrame(tick);
        });
    }

    // ---------- Rendering ----------
    function render() {
        const views = { home: viewHome, form: viewForm, report: viewReport, log: viewLog, settings: viewSettings, about: () => viewPage('about'), legal: () => viewPage('legal') };
        const out = (views[state.view] || viewHome)();
        const isHome = state.view === 'home';
        $('#viewTitle').textContent = out.title;
        $('#viewSubtitle').textContent = out.subtitle || '';
        $('#backBtn').hidden = isHome;
        $('#backBtn').innerHTML = icon('back').s;
        $('#brandIcon').hidden = !isHome;
        if (state.view !== 'form') $('#saveState').classList.remove('show');
        $('#app').innerHTML = out.body.s;
        const bar = $('#actionBar');
        bar.hidden = !out.actions;
        bar.innerHTML = out.actions ? out.actions.s : '';
        document.body.classList.toggle('has-actions', !!out.actions);
        document.title = isHome ? 'StationBrain | JFB Operational Workstation' : `${out.title} · StationBrain`;
        applyTheme();
        document.documentElement.style.setProperty('--topbar-h', `${$('.topbar').offsetHeight}px`);
        window.scrollTo(0, 0);
        if (out.after) out.after();
        syncSegs();
        countUp($('#app'));
    }

    const greeting = d => d.getHours() < 12 ? 'Good morning' : d.getHours() < 17 ? 'Good afternoon' : 'Good evening';
    const longDate = d => `${DAYS_LONG[d.getDay()]}, ${d.getDate()} ${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`;
    // Keep the whole hero current, not just the clock: the app often stays
    // open on a phone across noon or midnight.
    let heroDay = todayISO();
    setInterval(() => {
        const clock = $('#heroClock');
        if (!clock) return;
        const now = new Date();
        if (todayISO(now) !== heroDay && state.view === 'home') { heroDay = todayISO(now); render(); return; }
        clock.textContent = nowHM(now);
        $('#heroGreet').textContent = greeting(now);
        $('#heroDate').textContent = longDate(now);
    }, 15000);

    function viewHome() {
        heroDay = todayISO();
        const drafts = loadDrafts();
        const log = loadLog();
        const last = log.length ? normalizeEntry(log[0]) : null;
        const now = new Date();
        const created = log.map(e => new Date(Number(e.createdAt) || Number(e.id)));
        const stats = {
            today: created.filter(d => todayISO(d) === todayISO(now)).length,
            month: created.filter(d => d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()).length,
            drafts: Object.values(drafts).filter(isObj).length
        };
        const modeCard = (id, m) => {
            const d = isObj(drafts[id]) ? drafts[id] : null;
            const pill = d ? html`<span class="pill ${d.editingId != null ? 'pill-blue' : ''}">${d.editingId != null ? 'Editing' : 'Draft'} · ${shortStamp(d.savedAt)}</span>` : '';
            return html`
                <button class="card nav-card" data-action="open-mode" data-mode="${id}">
                    <span class="tile tile-${id}">${icon(m.icon)}</span>
                    <span class="nav-text">
                        <span class="nav-title">${m.title}${pill}</span>
                        <span class="nav-desc">${d ? 'Tap to continue where you left off' : m.desc}</span>
                    </span>
                    ${icon('right')}
                </button>`;
        };
        return {
            title: 'StationBrain',
            subtitle: 'JFB Workstation',
            body: html`
                <div class="stack">
                    <section class="hero-card" aria-label="Today">
                        <span class="sheen" aria-hidden="true"></span>
                        <div class="hero-top">
                            <div>
                                <p class="hero-greet" id="heroGreet">${greeting(now)}</p>
                                <p class="hero-clock" id="heroClock">${nowHM(now)}</p>
                                <p class="hero-date" id="heroDate">${longDate(now)}</p>
                            </div>
                            <div class="hero-tags">
                                <span class="hero-badge">${icon('pin')}<span>${prefs.station}</span></span>
                                ${prefs.watch ? html`<span class="hero-badge">Watch ${prefs.watch}</span>` : ''}
                            </div>
                        </div>
                        <div class="hero-stats">
                            <div class="hero-stat"><b data-count="${stats.today}">${stats.today}</b><span>Today</span></div>
                            <div class="hero-stat"><b data-count="${stats.month}">${stats.month}</b><span>This month</span></div>
                            <div class="hero-stat"><b data-count="${stats.drafts}">${stats.drafts}</b><span>Drafts</span></div>
                        </div>
                    </section>
                    <p class="eyebrow">Start a report</p>
                    <div class="stack-sm">${Object.entries(MODES).map(([id, m]) => modeCard(id, m))}</div>
                    <button class="card nav-card" data-action="nav" data-view="log">
                        <span class="tile tile-log">${icon('archive')}</span>
                        <span class="nav-text">
                            <span class="nav-title">Reports Log${log.length ? html`<span class="count">${log.length}</span>` : ''}</span>
                            <span class="nav-desc">${last ? `Last: ${last.title} · ${shortStamp(last.updatedAt || last.createdAt)}` : 'Saved report history'}</span>
                        </span>
                        ${icon('right')}
                    </button>
                    <nav class="footer-links" aria-label="More">
                        <button class="btn" data-action="nav" data-view="settings">Settings</button>
                        <button class="btn" data-action="nav" data-view="about">About</button>
                        <button class="btn" data-action="nav" data-view="legal">Legal</button>
                    </nav>
                </div>`
        };
    }

    // ----- Form -----
    function fieldControl(fd) {
        const id = fd.id;
        const val = str(state.form[id]);
        switch (fd.type) {
            case 'textarea':
                return html`<textarea class="input" id="f_${id}" data-field="${id}" rows="${fd.rows || 4}" placeholder="${fd.placeholder || ''}" autocapitalize="sentences" data-autogrow>${val}</textarea>`;
            case 'station': {
                const opts = STATIONS.includes(val) || !val ? STATIONS : [val, ...STATIONS];
                return html`<select class="input" id="f_${id}" data-field="${id}">${val ? '' : html`<option value="">Select station</option>`}${opts.map(s => html`<option value="${s}" ${s === val ? raw('selected') : ''}>${s}</option>`)}</select>`;
            }
            case 'seg':
            case 'chips':
                return html`<div class="${fd.type}" role="group" aria-labelledby="lbl_${id}" id="f_${id}">${fd.options.map(o => html`<button type="button" data-action="seg" data-field="${id}" data-value="${o.value}" aria-pressed="${String(val === o.value)}">${o.label}</button>`)}</div>`;
            case 'date':
            case 'time':
                return html`<input class="input" type="${fd.type}" id="f_${id}" data-field="${id}" value="${val}">`;
            case 'int':
                return html`<input class="input" type="text" inputmode="numeric" pattern="[0-9]*" id="f_${id}" data-field="${id}" data-sanitize="int" value="${val}" placeholder="${fd.placeholder || ''}" enterkeyhint="next">`;
            case 'decimal':
                return html`<input class="input" type="text" inputmode="decimal" id="f_${id}" data-field="${id}" data-sanitize="decimal" value="${val}" placeholder="${fd.placeholder || ''}" enterkeyhint="next">`;
            default: {
                const suggestions = typeof fd.suggest === 'function' ? fd.suggest() : fd.suggest;
                const list = suggestions && suggestions.length
                    ? html`<datalist id="dl_${id}">${suggestions.map(o => html`<option value="${o}"></option>`)}</datalist>`
                    : '';
                return html`<input class="input" type="text" id="f_${id}" data-field="${id}" value="${val}" placeholder="${fd.placeholder || ''}" autocapitalize="${fd.cap || 'sentences'}" autocorrect="off" spellcheck="false" enterkeyhint="next" ${list ? raw(`list="dl_${id}"`) : ''}>${list}`;
            }
        }
    }

    function renderField(fd) {
        if (Array.isArray(fd)) return html`<div class="row">${fd.map(renderField)}</div>`;
        if (fd.type === 'checklist') return renderChecklist();
        if (fd.type === 'duration') return html`<p class="hint" data-duration data-from="${fd.from}" data-to="${fd.to}" data-text="${fd.text}" data-next="${fd.nextDay || 'next day'}" hidden></p>`;
        const isGroup = fd.type === 'seg' || fd.type === 'chips';
        const labelInner = html`${fd.label}${fd.required ? html`<span class="req" aria-hidden="true"> *</span>` : ''}`;
        const label = isGroup
            ? html`<span class="label" id="lbl_${fd.id}">${labelInner}</span>`
            : html`<label class="label" id="lbl_${fd.id}" for="f_${fd.id}">${labelInner}</label>`;
        const extra = fd.type === 'time'
            ? html`<button type="button" class="mini-btn" data-action="now" data-field="${fd.id}" aria-label="Set ${fd.label} to current time">Now</button>`
            : (fd.stamp || fd.incidents) ? html`<span class="btn-group">
                ${fd.incidents ? html`<button type="button" class="mini-btn" data-action="add-incidents" data-field="${fd.id}" data-incidents-btn hidden>${icon('list')}<span>Add incidents</span></button>` : ''}
                ${fd.stamp ? html`<button type="button" class="mini-btn" data-action="stamp" data-field="${fd.id}">${icon('clock')}Insert time</button>` : ''}
              </span>` : '';
        return html`
            <div class="field" data-wrap="${fd.id}">
                <div class="label-row">${label}${extra}</div>
                ${fieldControl(fd)}
                <p class="field-error" id="err_${fd.id}">${fd.label} is required</p>
            </div>`;
    }

    function renderChecklist() {
        return html`
            <div class="field">
                <div class="checklist-head">
                    <span class="label" data-check-progress></span>
                    <button type="button" class="mini-btn" data-action="check-all">${icon('check')}Mark all Yes</button>
                </div>
                <div class="progress" aria-hidden="true"><span data-check-bar></span></div>
                <div>${CHECKS.map(c => {
                    const key = checkKey(c);
                    const val = state.form[key];
                    return html`
                        <div class="check-row">
                            <span class="check-label" id="lbl_${key}">${c}</span>
                            <div class="seg seg-sm" role="group" aria-labelledby="lbl_${key}">
                                ${YES_NO.map(o => html`<button type="button" class="opt-${o.value}" data-action="seg" data-field="${key}" data-value="${o.value}" aria-pressed="${String(val === o.value)}">${o.label}</button>`)}
                            </div>
                        </div>`;
                })}</div>
            </div>`;
    }

    function viewForm() {
        const def = FORMS[state.mode];
        const m = MODES[state.mode];
        const found = state.editingId != null ? findEntry(state.editingId) : null;
        const editing = found ? normalizeEntry(found) : null;
        return {
            title: m.title,
            subtitle: editing ? `Editing report from ${editing.timestamp}` : 'New report',
            body: html`
                <form class="stack" id="reportForm" novalidate autocomplete="off">
                    ${def.sections.length >= 4 ? html`
                        <nav class="section-nav no-print" id="sectionNav" aria-label="Jump to section">
                            ${def.sections.map((s, i) => html`<button type="button" data-action="jump" data-section="${i}" ${s.when && !s.when(state.form) ? raw('hidden') : ''}><span class="dot"></span>${s.nav || s.title}</button>`)}
                        </nav>` : ''}
                    ${editing ? html`
                        <div class="banner">
                            ${icon('edit')}
                            <div class="banner-text"><strong>Editing a saved report</strong><p>Updating will replace the saved version in the log.</p></div>
                            <button type="button" class="mini-btn" data-action="discard-edit">Discard</button>
                        </div>` : ''}
                    ${def.sections.map((s, i) => html`
                        <section class="card form-section" data-section="${i}" ${s.when && !s.when(state.form) ? raw('hidden') : ''}>
                            <h2 class="section-title">${s.title}</h2>
                            ${s.fields.map(renderField)}
                        </section>`)}
                    <button type="button" class="btn btn-ghost-danger" data-action="clear-form">${icon('trash')}Clear form</button>
                </form>`,
            actions: html`
                <button class="btn btn-secondary" data-action="home">Menu</button>
                <button class="btn btn-primary btn-grow" data-action="generate">${editing ? 'Update Report' : 'Generate Report'}</button>`,
            after() {
                $$('[data-autogrow]').forEach(autogrow);
                updateComputed();
                updateActiveSection();
            }
        };
    }

    function autogrow(el) {
        el.style.height = 'auto';
        el.style.height = `${el.scrollHeight + 2}px`;
    }

    function updateConditionals() {
        FORMS[state.mode].sections.forEach((s, i) => {
            if (!s.when) return;
            $$(`[data-section="${i}"]`).forEach(el => { el.hidden = !s.when(state.form); });
        });
        syncSegs();
    }

    function updateComputed() {
        $$('[data-duration]').forEach(hint => {
            const dur = duration(state.form[hint.dataset.from], state.form[hint.dataset.to]);
            hint.hidden = !dur;
            if (dur) hint.innerHTML = html`${icon('clock')}<span>${hint.dataset.text}: ${dur.text}${dur.nextDay ? ` (${hint.dataset.next})` : ''}</span>`.s;
        });
        const incBtn = $('[data-incidents-btn]');
        if (incBtn) {
            const n = incidentsOn(state.form.date).length;
            incBtn.hidden = !n;
            incBtn.querySelector('span').textContent = `Add incidents (${n})`;
        }
        const nav = $('#sectionNav');
        if (nav) {
            const req = FORMS[state.mode].required || [];
            FORMS[state.mode].sections.forEach((s, i) => {
                const ids = s.fields.flat().map(fd => fd.type === 'checklist' ? CHECKS.map(checkKey) : [fd.id]).flat();
                const filled = ids.some(id => str(state.form[id]).trim() && state.form[id] !== 'not_stated');
                const reqOk = ids.filter(id => req.includes(id)).every(id => str(state.form[id]).trim());
                const dot = nav.querySelector(`[data-section="${i}"] .dot`);
                if (dot) dot.classList.toggle('done', filled && reqOk);
            });
        }
        const progress = $('[data-check-progress]');
        if (progress) {
            const done = CHECKS.filter(c => state.form[checkKey(c)] === 'yes').length;
            const answered = CHECKS.filter(c => ['yes', 'no'].includes(state.form[checkKey(c)])).length;
            progress.textContent = `${done} of ${CHECKS.length} done${answered > done ? ` · ${answered - done} marked No` : ''}`;
            $('[data-check-bar]').style.width = `${(done / CHECKS.length) * 100}%`;
        }
    }

    // Incident reports whose call date (or save date) matches the given day, oldest first.
    function incidentsOn(dateISO) {
        if (!dateISO) return [];
        return loadLog().map(normalizeEntry)
            .filter(e => e.mode === 'incident' && ((e.form && e.form.dateCall) || todayISO(new Date(e.createdAt))) === dateISO)
            .map(e => ({ e, time: (e.form && e.form.timeCall) || nowHM(new Date(e.createdAt)) }))
            .sort((a, b) => a.time.localeCompare(b.time))
            .map(({ e, time }) => `• ${time} ${e.title}${e.subtitle ? ` — ${e.subtitle.split(' · ')[0]}` : ''}`);
    }

    function addIncidents(field) {
        const el = $(`#f_${field}`);
        if (!el) return;
        const lines = incidentsOn(state.form.date).filter(l => !el.value.includes(l));
        if (!lines.length) { toast('Incidents already added'); return; }
        const header = el.value.includes('Incidents attended:') ? '' : 'Incidents attended:\n';
        const sep = el.value.trim() ? (el.value.endsWith('\n') ? '\n' : '\n\n') : '';
        el.value = `${el.value}${sep}${header}${lines.join('\n')}`;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        toast(`Added ${lines.length} incident${lines.length === 1 ? '' : 's'}`);
    }

    function updateActiveSection() {
        const nav = $('#sectionNav');
        if (!nav || state.view !== 'form') return;
        const line = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')) || 61) + nav.offsetHeight + 24;
        let active = null;
        $$('.form-section[data-section]').forEach(sec => { if (!sec.hidden && sec.getBoundingClientRect().top <= line) active = sec.dataset.section; });
        if (active == null) active = '0';
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
            const visible = $$('.form-section[data-section]').filter(sec => !sec.hidden);
            if (visible.length) active = visible[visible.length - 1].dataset.section;
        }
        nav.querySelectorAll('button').forEach(b => {
            const on = b.dataset.section === active;
            if (on && !b.classList.contains('active')) {
                const left = b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2;
                nav.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
            }
            b.classList.toggle('active', on);
        });
    }
    let scrollTick = false;
    window.addEventListener('scroll', () => {
        if (scrollTick) return;
        scrollTick = true;
        requestAnimationFrame(() => { scrollTick = false; updateActiveSection(); });
    }, { passive: true });

    function setFieldError(field, on) {
        const wrap = $(`[data-wrap="${field}"]`);
        if (!wrap) return;
        wrap.classList.toggle('invalid', on);
        const ctrl = $(`#f_${field}`);
        if (ctrl) {
            if (on) { ctrl.setAttribute('aria-invalid', 'true'); ctrl.setAttribute('aria-describedby', `err_${field}`); }
            else { ctrl.removeAttribute('aria-invalid'); ctrl.removeAttribute('aria-describedby'); }
        }
    }

    function onFieldChanged(field) {
        setFieldError(field, false);
        if (field === 'incidentType') updateConditionals();
        updateComputed();
        scheduleDraftSave();
    }

    function onFieldInput(e) {
        const el = e.target;
        const field = el.dataset && el.dataset.field;
        if (!field || state.view !== 'form') return;
        if (el.dataset.sanitize) {
            const clean = el.dataset.sanitize === 'int' ? el.value.replace(/\D/g, '') : el.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
            if (clean !== el.value) el.value = clean;
        }
        state.form[field] = el.value;
        if (el.hasAttribute('data-autogrow')) autogrow(el);
        onFieldChanged(field);
    }
    $('#app').addEventListener('input', onFieldInput);
    $('#app').addEventListener('change', onFieldInput);
    $('#app').addEventListener('submit', e => e.preventDefault());

    function onSeg(btn) {
        const { field, value } = btn.dataset;
        const next = state.form[field] === value ? '' : value;
        state.form[field] = next;
        btn.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === next)));
        onFieldChanged(field);
        syncSegs(btn.parentElement.parentElement);
    }

    function setInputValue(field, value) {
        const el = $(`#f_${field}`);
        if (!el) return;
        el.value = value;
        el.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function insertStamp(field) {
        const el = $(`#f_${field}`);
        if (!el) return;
        const start = el.selectionStart ?? el.value.length;
        const end = el.selectionEnd ?? el.value.length;
        const before = el.value.slice(0, start);
        const prefix = before && !before.endsWith('\n') ? '\n' : '';
        const text = `${prefix}[${nowHM()}] `;
        el.setRangeText(text, start, end, 'end');
        el.focus();
        el.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function validate() {
        return (FORMS[state.mode].required || []).filter(k => !str(state.form[k]).trim());
    }

    let persistRequested = false;
    function requestPersistentStorage() {
        if (persistRequested || !navigator.storage || !navigator.storage.persist) return;
        persistRequested = true;
        navigator.storage.persist().catch(() => {});
    }

    function generate() {
        const missing = validate();
        if (missing.length) {
            missing.forEach(k => setFieldError(k, true));
            const first = $(`[data-wrap="${missing[0]}"]`);
            if (first) {
                first.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const group = $(`#f_${missing[0]}`);
                const ctrl = group && group.matches('input, select, textarea') ? group : group && group.querySelector('button');
                if (ctrl) setTimeout(() => ctrl.focus({ preventScroll: true }), 300);
            }
            toast(`Required: ${missing.map(k => fieldLabel(state.mode, k)).join(', ')}`, { error: true });
            return;
        }
        const report = buildReport(state.mode, state.form);
        const log = loadLog();
        const now = Date.now();
        const idx = state.editingId != null ? log.findIndex(e => String(e.id) === String(state.editingId)) : -1;
        let entry;
        if (idx >= 0) {
            const prev = log[idx];
            entry = { ...prev, v: 2, ...report, form: { ...state.form }, createdAt: Number(prev.createdAt) || Number(prev.id) || now, updatedAt: now };
            ['admin', 'narrative', 'checks', 'classes', 'activities'].forEach(k => delete entry[k]);
            log[idx] = entry;
        } else {
            let id = now;
            while (log.some(e => e.id === id)) id++;
            let ref = refFor(now);
            const refs = new Set(log.map(e => e.ref));
            for (let n = 2; refs.has(ref); n++) ref = `${refFor(now)}-${n}`;
            entry = { id, v: 2, mode: state.mode, createdAt: now, timestamp: fmtStamp(now), ref, ...report, form: { ...state.form } };
            log.unshift(entry);
        }
        if (!saveLog(log)) {
            toast('Could not save — device storage is full. Export a backup and delete old reports.', { error: true, duration: 6000 });
            return;
        }
        const drafts = loadDrafts();
        delete drafts[state.mode];
        saveDrafts(drafts);
        state.mode = null;
        requestPersistentStorage();
        leaveFormFor(entry.id);
        toast(idx >= 0 ? 'Report updated' : 'Report saved to log');
    }

    // Leave the form for a report. An edit opened from that report's own
    // screen goes back to it (Back from there then goes where it did before);
    // otherwise the form's history entry becomes the report.
    function leaveFormFor(id) {
        if (state.params.from != null && String(state.params.from) === String(id)) history.back();
        else navigate('report', { id }, { replace: true });
    }

    // ----- Report -----
    const isEmptyVal = val => EMPTY_VALUES.has(val);

    function renderSection(s) {
        const doneCount = s.checks ? s.checks.filter(c => c.status === 'yes').length : 0;
        return html`
            <section class="card report-section">
                <div class="section-head">
                    <h3 class="section-title">${s.title}</h3>
                    ${s.checks && s.checks.length ? html`<span class="pill ${doneCount === s.checks.length ? 'pill-green' : ''}">${doneCount}/${s.checks.length} done</span>` : ''}
                </div>
                ${s.rows && s.rows.length ? html`<dl class="kv">${s.rows.map(([k, val]) => html`<dt>${k}</dt><dd class="${isEmptyVal(val) ? 'empty' : ''}">${val}</dd>`)}</dl>` : ''}
                ${s.checks && s.checks.length ? html`<ul class="checks">${s.checks.map(c => html`
                    <li><span>${c.label}</span><span class="status status-${c.status}">${c.status === 'yes' ? icon('check') : c.status === 'no' ? icon('x') : ''}${STATUS_LABEL[c.status]}</span></li>`)}</ul>` : ''}
                ${s.text != null ? html`<p class="prose ${isEmptyVal(s.text) ? 'empty' : ''}">${s.text}</p>` : ''}
                ${s.blocks ? s.blocks.map(b => html`<div class="block"><p class="block-label">${b.label}</p><p class="prose ${isEmptyVal(b.text) ? 'empty' : ''}">${b.text}</p></div>`) : ''}
            </section>`;
    }

    function viewReport() {
        const found = findEntry(state.params.id);
        if (!found) {
            return {
                title: 'Report',
                subtitle: 'Not found',
                body: html`
                    <div class="empty-state">
                        <span class="tile tile-log">${icon('archive')}</span>
                        <p class="empty-title">Report not found</p>
                        <p class="empty-text">It may have been deleted.</p>
                        <button class="btn btn-secondary" data-action="nav" data-view="log">Open Reports Log</button>
                    </div>`
            };
        }
        const e = normalizeEntry(found);
        const m = MODES[e.mode];
        const draft = loadDrafts()[e.mode];
        const hasPendingEdits = draft && String(draft.editingId) === String(e.id);
        const canShare = typeof navigator.share === 'function';
        return {
            title: m.title,
            subtitle: e.updatedAt ? `Updated ${fmtStamp(e.updatedAt)}` : `Saved ${e.timestamp}`,
            body: html`

    async function copyText(text) {
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return true;
            }
        } catch { /* fall through to legacy copy */ }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch { ok = false; }
        ta.remove();
        return ok;
    }

    async function copyReport(id) {
        const entry = findEntry(id);
        if (!entry) return;
        if (await copyText(reportText(entry))) {
            toast('Report copied to clipboard');
        } else {
            const details = $('#plainText');
            if (details) { details.open = true; details.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
            toast('Copy blocked — select the plain-text version and copy it manually', { error: true, duration: 5000 });
        }
    }

    async function shareReport(id) {
        const entry = findEntry(id);
        if (!entry) return;
        const e = normalizeEntry(entry);
        try {
            await navigator.share({ title: `${MODES[e.mode].title}: ${e.title}`, text: reportText(entry) });
        } catch (err) {
            if (err && err.name === 'AbortError') return;
            copyReport(id);
        }
    }

    async function editReport(id) {
        const entry = findEntry(id);
        if (!entry || !isObj(entry.form)) return;
        const drafts = loadDrafts();
        const existing = drafts[entry.mode];
        const sameEdit = existing && String(existing.editingId) === String(entry.id);
        if (existing && !sameEdit) {
            const ok = await confirmDialog({
                title: 'Replace unsaved draft?',
                message: `You have an unfinished ${MODES[entry.mode].title.toLowerCase()} draft. Editing this report will replace it.`,
                confirmLabel: 'Replace draft',
                danger: true
            });
            if (!ok) return;
        }
        if (!sameEdit) {
            drafts[entry.mode] = { form: { ...entry.form }, editingId: entry.id, savedAt: Date.now() };
            saveDrafts(drafts);
        }
        const fromReport = state.view === 'report' && String(state.params.id) === String(entry.id);
        navigate('form', fromReport ? { mode: entry.mode, from: entry.id } : { mode: entry.mode });
    }

    function deleteReport(id) {
        const log = loadLog();
        const idx = log.findIndex(e => String(e.id) === String(id));
        if (idx < 0) return;
        const [removed] = log.splice(idx, 1);
        saveLog(log);
        const drafts = loadDrafts();
        const editDraft = drafts[removed.mode];
        if (editDraft && String(editDraft.editingId) === String(id)) { delete drafts[removed.mode]; saveDrafts(drafts); }
        const undo = () => {
            const cur = loadLog();
            if (cur.some(e => String(e.id) === String(removed.id))) return;
            cur.splice(Math.min(idx, cur.length), 0, removed);
            saveLog(cur);
            if (editDraft && String(editDraft.editingId) === String(id)) {
                const d = loadDrafts();
                if (!d[removed.mode]) { d[removed.mode] = editDraft; saveDrafts(d); }
            }
            if (state.view === 'log' || state.view === 'home') render();
            toast('Report restored');
        };
        if (state.view === 'report') {
            state.skipMissing = true;
            goBack();
        } else {
            render();
        }
        toast('Report deleted', { action: { label: 'Undo', fn: undo } });
    }

    // ----- Log -----
    function filteredLog() {
        const q = state.logQuery.trim().toLowerCase();
        return loadLog()
            .map(raw0 => ({ raw0, e: normalizeEntry(raw0) }))
            .filter(({ e }) => state.logFilter === 'all' || e.mode === state.logFilter)
            .filter(({ raw0 }) => !q || reportText(raw0).toLowerCase().includes(q))
            .map(({ e }) => e)
            .sort((a, b) => b.createdAt - a.createdAt);
    }

    function dayLabel(ts) {
        const d = new Date(ts);
        const today = todayISO();
        const y = new Date(); y.setDate(y.getDate() - 1);
        if (todayISO(d) === today) return 'Today';
        if (todayISO(d) === todayISO(y)) return 'Yesterday';
        return fmtDate(todayISO(d));
    }

    function renderLogList() {
        const entries = filteredLog();
        if (!entries.length) {
            return html`

                    <p class="empty-title">No matching reports</p>
                    <p class="empty-text">Try a different search or filter.</p>
                </div>`;
        }
        let lastDay = null;
        let i = 0;
        return html`${entries.map(e => {
            const day = dayLabel(e.createdAt);
            const heading = day !== lastDay ? html`<p class="day-label" style="--i: ${i++}">${day}</p>` : '';
            lastDay = day;
            return html`${heading}
                <button class="card list-item" data-action="nav" data-view="report" data-id="${e.id}" style="--i: ${i++}">
                    <span class="tile tile-md tile-${e.mode}">${icon(MODES[e.mode].icon)}</span>

    function exportBackup() {
        const log = loadLog();
        if (!log.length) { toast('No reports to export'); return; }
        const data = JSON.stringify({ app: 'StationBrain', version: APP_VERSION, exportedAt: new Date().toISOString(), reports: log }, null, 2);
        const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `stationbrain-backup-${todayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast(`Exported ${log.length} report${log.length === 1 ? '' : 's'}`);
    }

    async function importBackup(file) {
        let data;
        try { data = JSON.parse(await file.text()); }
        catch { toast('That file is not a valid StationBrain backup', { error: true }); return; }
        const incoming = Array.isArray(data) ? data : (isObj(data) && Array.isArray(data.reports) ? data.reports : null);
        if (!incoming) { toast('No reports found in that file', { error: true }); return; }
        const valid = incoming.filter(e => isObj(e) && e.id != null && MODES[e.mode]);
        const log = loadLog();
        const ids = new Set(log.map(e => String(e.id)));
        const added = valid.filter(e => {
            const key = String(e.id);
            if (ids.has(key)) return false;
            ids.add(key);
            return true;
        });
        const merged = [...log, ...added].sort((a, b) => (Number(b.createdAt) || Number(b.id) || 0) - (Number(a.createdAt) || Number(a.id) || 0));
        if (!saveLog(merged)) { toast('Import failed — device storage is full', { error: true }); return; }
        render();
        const skipped = incoming.length - added.length;
        toast(`Imported ${added.length} report${added.length === 1 ? '' : 's'}${skipped ? ` · ${skipped} skipped (duplicate or invalid)` : ''}`);
    }

    async function clearAllReports() {
        const count = loadLog().length;
        const ok = await confirmDialog({
            title: 'Delete all reports?',
            message: `This permanently removes ${count} saved report${count === 1 ? '' : 's'} from this device. Export a backup first if you might need them.`,
            confirmLabel: 'Delete all',
            danger: true
        });
        if (!ok) return;
        saveLog([]);
        const drafts = loadDrafts();
        Object.values(drafts).forEach(d => { if (isObj(d)) d.editingId = null; });
        saveDrafts(drafts);
        render();
        toast('All reports deleted');
    }

    // ---------- Actions ----------
    const ACTIONS = {
        'back': () => goBack(),
        'home': () => {
            const hadDraft = state.view === 'form' && saveDraftNow();
            goHome();
            if (hadDraft) toast('Draft saved — tap the card to continue');
        },
        'nav': el => navigate(el.dataset.view, el.dataset.id != null ? { id: el.dataset.id } : {}),
        'open-mode': el => navigate('form', { mode: el.dataset.mode }),
        'toggle-theme': () => { prefs.theme = resolvedTheme() === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); },
        'set-theme': el => { prefs.theme = el.dataset.value; savePrefs(); applyTheme(); },
        'seg': el => onSeg(el),
        'now': el => setInputValue(el.dataset.field, nowHM()),
        'stamp': el => insertStamp(el.dataset.field),
        'jump': el => {
            const sec = $(`.form-section[data-section="${el.dataset.section}"]`);
            if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },
        'add-incidents': el => addIncidents(el.dataset.field),
        'pref-watch': el => {
            prefs.watch = prefs.watch === el.dataset.value ? '' : el.dataset.value;
            savePrefs();
            $$('[data-action="pref-watch"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === prefs.watch)));
            syncSegs();
            toast(prefs.watch ? `Default watch set to ${prefs.watch}` : 'Default watch cleared');
        },
        'check-all': () => {
            CHECKS.forEach(c => { state.form[checkKey(c)] = 'yes'; });
            $$('.check-row [data-action="seg"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === 'yes')));
            syncSegs();
            updateComputed();
            scheduleDraftSave();
        },
        'generate': () => generate(),
        'clear-form': async () => {
            const ok = await confirmDialog({ title: 'Clear this form?', message: 'All entries on this form will be erased. Saved reports in the log are not affected.', confirmLabel: 'Clear form', danger: true });
            if (!ok) return;
            state.form = FORMS[state.mode].defaults();
            state.editingId = null;
            saveDraftNow();
            render();
            toast('Form cleared');
        },
        'discard-edit': async () => {
            const id = state.editingId;
            const ok = await confirmDialog({ title: 'Discard changes?', message: 'Your edits will be thrown away. The saved report stays as it was.', confirmLabel: 'Discard', danger: true });
            if (!ok) return;
            const drafts = loadDrafts();
            delete drafts[state.mode];
            saveDrafts(drafts);
            state.mode = null;
            leaveFormFor(id);
        },
        'copy-report': el => copyReport(el.dataset.id),
        'share-report': el => shareReport(el.dataset.id),

        'delete-report': el => deleteReport(el.dataset.id),

    document.addEventListener('click', e => {
        const el = e.target.closest('[data-action]');
        if (!el || el.disabled) return;
        const fn = ACTIONS[el.dataset.action];
        if (fn) { e.preventDefault(); fn(el, e); }
    });

        if (e.target.id === 'prefDO') { prefs.districtOfficer = e.target.value.trim(); savePrefs(); }
        if (e.target.id === 'logSearch') {
            state.logQuery = e.target.value;
            // Typing doesn't replay the row entrance on every keystroke.
            $('#logList').classList.add('is-live');
            $('#logList').innerHTML = renderLogList().s;
        }
    });

        if (e.target.id === 'prefStation') { prefs.station = e.target.value; savePrefs(); toast('Home station updated'); }
        if (e.target.id === 'prefDO') { prefs.districtOfficer = e.target.value.trim(); savePrefs(); toast('District Officer saved'); }

    });

    // ---------- Boot ----------
    $('#appVersion').textContent = APP_VERSION;
    // The app resets scroll per view itself; stop the browser restoring stale positions on back/forward.
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.addEventListener('resize', () => {
        document.documentElement.style.setProperty('--topbar-h', `${$('.topbar').offsetHeight}px`);
        syncSegs();
    });

    (function boot() {
        const initial = validState(history.state) ? history.state : { view: 'home', params: {}, depth: 0 };
        history.replaceState(initial, '');
        show(initial);
    })();

    // ---------- Loading screen ----------
    // The fire truck drives, then dashes off the road; the app logo draws
    // itself in its place, then the logo and title fly up into the header
    // while the home screen drops in beneath them. Once per session; a tap
    // skips it. If the header logo isn't on screen (a reload mid-report), the
    // splash just fades.
    (function sbSplash() {
        const root = document.documentElement;
        const el = $('#nsc-splash');
        if (!el) return;
        if (!root.classList.contains('sb-splash')) { el.remove(); return; }
        try { sessionStorage.setItem('stationbrain_splash', '1'); } catch (e) {}
        const reduce = reducedMotion();
        let over = false;
        const later = (fn, ms) => setTimeout(() => { if (!over) fn(); }, reduce ? Math.min(ms, 350) : ms);
        const rect = n => {
            const r = n && n.getBoundingClientRect();
            return r && r.width > 0 && r.height > 0 ? r : null;
        };
        const finish = () => {
            over = true;
            root.classList.remove('nsc-booting', 'nsc-handoff', 'sb-splash');
            el.remove();
            setTimeout(() => root.classList.remove('nsc-intro'), 1400);
        };
        const fadeOut = () => {
            if (over) return;
            el.classList.add('is-leaving');
            el.setAttribute('aria-hidden', 'true');
            root.classList.remove('nsc-booting');
            later(finish, 450);
        };
        el.addEventListener('click', fadeOut);

        // Accelerate the truck from wherever it is off the right edge.
        const dashOff = next => {
            const lane = el.querySelector('.nsc-lane');
            if (reduce || !lane || !lane.animate || !window.DOMMatrix) return next();
            try {
                const x = new DOMMatrix(getComputedStyle(lane).transform).m41;
                const end = lane.offsetWidth + 150;
                const ms = Math.round(Math.max(220, Math.min(520, Math.max(0, end - x) * 0.9)));
                lane.style.animation = 'none';
                lane.style.transform = `translateX(${end}px)`;
                lane.animate([{ transform: `translateX(${x}px)` }, { transform: `translateX(${end}px)` }],
                    { duration: ms, easing: 'cubic-bezier(0.55, 0, 0.9, 0.45)' });
                el.classList.add('is-dashing');
                later(next, Math.max(0, ms - 140));
            } catch (e) { next(); }
        };

        // Fly the splash logo and title onto the header's (FLIP: measure
        // both, animate the difference), dropping the backdrop as they go.
        const flyHome = () => {
            const brand = el.querySelector('.nsc-brand');
            const title = el.querySelector('.nsc-splash-title');
            const toLogo = $('[data-splash-target="logo"]');
            const toTitle = $('[data-splash-target="title"]');
            const a = rect(brand), b = rect(toLogo);
            if (reduce || !a || !b || !brand.animate) return fadeOut();
            const ms = 680;
            const ease = 'cubic-bezier(0.45, 0, 0.15, 1)';
            const k = b.width / a.width;
            const dx = b.left + b.width / 2 - (a.left + a.width / 2);
            const dy = b.top + b.height / 2 - (a.top + a.height / 2);
            const svg = brand.querySelector('svg');
            const radius = parseFloat(getComputedStyle(toLogo).borderTopLeftRadius) || 0;
            root.classList.add('nsc-handoff');
            el.classList.add('is-flying');
            el.setAttribute('aria-hidden', 'true');
            const flight = brand.animate([{ transform: 'none' }, { transform: `translate(${dx}px, ${dy}px) scale(${k})` }],
                { duration: ms, easing: ease, fill: 'forwards' });
            if (svg) {
                svg.animate([{ borderRadius: getComputedStyle(svg).borderTopLeftRadius }, { borderRadius: `${radius / k}px`, boxShadow: 'none' }],
                    { duration: ms, easing: ease, fill: 'forwards' });
            }
            const c = rect(title), d = rect(toTitle);
            if (c && d && toTitle.textContent.trim() === title.textContent.trim()) {
                const ts = parseFloat(getComputedStyle(toTitle).fontSize) / parseFloat(getComputedStyle(title).fontSize);
                title.animate([{ transform: 'none' }, { transform: `translate(${d.left - c.left}px, ${d.top + d.height / 2 - (c.top + c.height / 2)}px) scale(${ts})` }],
                    { duration: ms, easing: ease, fill: 'forwards' });
            } else {
                title.style.opacity = '0';
            }
            // The page starts falling in once the logo is most of the way up.
            later(() => root.classList.remove('nsc-booting'), ms * 0.55);
            let landed = false;
            const land = () => {
                if (landed) return;
                landed = true;
                finish();
                toLogo.classList.add('nsc-landed');
            };
            flight.onfinish = land;
            setTimeout(land, ms + 250);
        };

        later(() => dashOff(() => {
            el.classList.add('is-ready');
            el.setAttribute('aria-busy', 'false');
            later(flyHome, 950);
        }), 800);
    })();

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err));
        });
    }
    </script>
</body>
</html>
